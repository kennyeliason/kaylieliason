[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.23.4"

# Dream Phone moved to its own site. Query strings (?room=CODE) pass through.
[[redirects]]
  from = "/dream-phone"
  to = "https://dreamphone.app/"
  status = 301
  force = true

[[redirects]]
  from = "/api/party-room"
  to = "/.netlify/functions/party-room"
  status = 200

[[redirects]]
  from = "/api/bluff-room"
  to = "/.netlify/functions/bluff-room"
  status = 200
