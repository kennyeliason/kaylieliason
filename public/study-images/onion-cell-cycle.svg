<svg width="1100" height="420" viewBox="0 0 1100 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1100" height="420" rx="28" fill="#FFF9F1"/>
  <rect x="18" y="18" width="1064" height="384" rx="22" fill="#FFFDF9" stroke="#E7D7C1" stroke-width="2"/>
  <text x="550" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#9A3412">Onion Root Tip Cell Cycle Reference</text>
  <text x="550" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#92400E">Count the cells in each phase to answer the onion-cell questions.</text>

  <defs>
    <g id="cell-frame">
      <rect x="0" y="0" width="72" height="120" rx="14" fill="#FEF3E7" stroke="#D6B38B" stroke-width="2"/>
      <rect x="6" y="6" width="60" height="108" rx="10" fill="#FFF8EF" opacity="0.9"/>
    </g>

    <g id="interphase">
      <use href="#cell-frame"/>
      <circle cx="36" cy="60" r="20" fill="#E8D5FF" stroke="#8B5CF6" stroke-width="2"/>
      <circle cx="36" cy="60" r="6" fill="#7C3AED"/>
      <circle cx="27" cy="50" r="2.6" fill="#A78BFA"/>
      <circle cx="45" cy="52" r="2.2" fill="#A78BFA"/>
      <circle cx="31" cy="70" r="2.3" fill="#A78BFA"/>
      <circle cx="43" cy="69" r="2.1" fill="#A78BFA"/>
    </g>

    <g id="prophase">
      <use href="#cell-frame"/>
      <circle cx="36" cy="60" r="22" fill="#F3E8FF" stroke="#A855F7" stroke-width="2" stroke-dasharray="3 4"/>
      <path d="M24 47L31 55L25 63L33 72" stroke="#6D28D9" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M42 45L49 53L43 61L51 70" stroke="#6D28D9" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M31 43L38 51L32 59" stroke="#7C3AED" stroke-width="3" stroke-linecap="round"/>
      <path d="M39 61L46 69L40 76" stroke="#7C3AED" stroke-width="3" stroke-linecap="round"/>
    </g>

    <g id="metaphase">
      <use href="#cell-frame"/>
      <line x1="36" y1="18" x2="36" y2="102" stroke="#C4B5FD" stroke-width="2"/>
      <line x1="18" y1="34" x2="36" y2="60" stroke="#C4B5FD" stroke-width="2"/>
      <line x1="54" y1="34" x2="36" y2="60" stroke="#C4B5FD" stroke-width="2"/>
      <line x1="18" y1="86" x2="36" y2="60" stroke="#C4B5FD" stroke-width="2"/>
      <line x1="54" y1="86" x2="36" y2="60" stroke="#C4B5FD" stroke-width="2"/>
      <path d="M31 46L41 58L31 70" stroke="#5B21B6" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M24 47L34 59L24 71" stroke="#7C3AED" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M38 47L48 59L38 71" stroke="#7C3AED" stroke-width="3.2" stroke-linecap="round"/>
    </g>

    <g id="telophase">
      <use href="#cell-frame"/>
      <line x1="18" y1="60" x2="54" y2="60" stroke="#F59E0B" stroke-width="2.5"/>
      <circle cx="36" cy="37" r="14" fill="#F5D0FE" stroke="#A855F7" stroke-width="2"/>
      <circle cx="36" cy="83" r="14" fill="#F5D0FE" stroke="#A855F7" stroke-width="2"/>
      <circle cx="36" cy="37" r="4.5" fill="#7E22CE"/>
      <circle cx="36" cy="83" r="4.5" fill="#7E22CE"/>
    </g>
  </defs>

  <g transform="translate(44 118)"><use href="#interphase"/></g>
  <g transform="translate(136 118)"><use href="#prophase"/></g>
  <g transform="translate(228 118)"><use href="#interphase"/></g>
  <g transform="translate(320 118)"><use href="#metaphase"/></g>
  <g transform="translate(412 118)"><use href="#interphase"/></g>
  <g transform="translate(504 118)"><use href="#interphase"/></g>
  <g transform="translate(596 118)"><use href="#telophase"/></g>
  <g transform="translate(688 118)"><use href="#interphase"/></g>
  <g transform="translate(780 118)"><use href="#prophase"/></g>
  <g transform="translate(872 118)"><use href="#interphase"/></g>
  <g transform="translate(964 118)"><use href="#metaphase"/></g>

  <g transform="translate(44 258)"><use href="#interphase"/></g>
  <g transform="translate(136 258)"><use href="#interphase"/></g>
  <g transform="translate(228 258)"><use href="#prophase"/></g>
  <g transform="translate(320 258)"><use href="#interphase"/></g>
  <g transform="translate(412 258)"><use href="#telophase"/></g>
  <g transform="translate(504 258)"><use href="#interphase"/></g>
  <g transform="translate(596 258)"><use href="#metaphase"/></g>
  <g transform="translate(688 258)"><use href="#interphase"/></g>
  <g transform="translate(780 258)"><use href="#prophase"/></g>
  <g transform="translate(872 258)"><use href="#interphase"/></g>
  <g transform="translate(964 258)"><use href="#prophase"/></g>
</svg>
